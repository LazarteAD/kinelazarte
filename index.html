<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <title>KineFlow Clinical</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- FullCalendar CSS y JS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo-icon">K</div>
      <div><h1>KineFlow <span>Clinical</span></h1><small>Rehabilitación con evidencia</small></div>
    </div>
    <div id="sync-status" class="sync-indicator offline">Offline</div>
  </header>

  <main class="main-content">
    <!-- LOGIN -->
    <div id="login-view" class="view">
      <div class="card login-card">
        <h2>Acceso Profesional</h2>
        <label>Email</label><input type="email" id="login-email" placeholder="kine@correo.com">
        <label>Contraseña</label><input type="password" id="login-password" placeholder="••••••••">
        <button onclick="login()" class="btn-primary mt-2">Ingresar</button>
      </div>
    </div>

    <!-- DASHBOARD (LISTA DE PACIENTES) -->
    <div id="dashboard-view" class="view hidden">
      <div class="header-actions">
        <h2>Mis Pacientes</h2>
        <button onclick="showView('calendar-view')" class="btn-icon" title="Ver Calendario">📅</button>
      </div>
      <div id="patient-list" class="patient-grid"></div>
      <button onclick="showView('new-patient-view')" class="btn-fab">+ Nuevo Paciente</button>
    </div>

    <!-- CALENDARIO -->
    <div id="calendar-view" class="view hidden">
      <div class="header-actions">
        <h2>Agenda de Turnos</h2>
        <button onclick="showView('dashboard-view')" class="btn-icon" title="Volver a Pacientes">👥</button>
      </div>
      <div id="calendar-container" class="card"></div>
    </div>

    <!-- NUEVO PACIENTE -->
    <div id="new-patient-view" class="view hidden">
      <div class="header-actions">
        <h2>Nuevo Paciente</h2>
        <button onclick="showView('dashboard-view')" class="btn-text">Cancelar</button>
      </div>
      <div class="card">
        <label>Nombre completo</label><input type="text" id="new-patient-name" placeholder="Ej: Juan Pérez">
        <label>WhatsApp (código país, sin +)</label><input type="tel" id="new-patient-phone" placeholder="Ej: 5491123456789">
        <div class="grid-2">
          <div><label>Edad</label><input type="number" id="new-patient-age"></div>
          <div><label>Peso (kg)</label><input type="number" id="new-patient-weight"></div>
        </div>
        <label>Diagnóstico</label><select id="new-patient-pathology"></select>
        <label>Fecha y Hora del Primer Turno</label>
        <input type="datetime-local" id="new-patient-turno">
        <button onclick="createPatient()" class="btn-primary mt-2">Guardar Paciente</button>
      </div>
    </div>

    <!-- SESIÓN (Misma estructura que ya tenías) -->
    <div id="session-view" class="view hidden">
      <div class="session-topbar">
        <button onclick="showView('dashboard-view')" class="btn-icon">←</button>
        <h2 id="session-patient-name">Paciente</h2>
        <button onclick="exportarHistoria()" class="btn-icon">🖨️</button>
      </div>
      <!-- ... (El contenido de las pestañas de sesión se mantiene igual, omitido por brevedad) ... -->
      <div class="tab-content">
        <!-- Pestaña Mapa, Terapia, Evolución, Cierre -->
        <!-- ... -->
      </div>
      <nav class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('mapa', this)"><span>🗺️</span>Mapa</button>
        <button class="tab-btn" onclick="switchTab('ejercicios', this)"><span>🏋️</span>Terapia</button>
        <button class="tab-btn" onclick="switchTab('evolucion', this)"><span>📊</span>Evolución</button>
        <button class="tab-btn" onclick="switchTab('cierre', this)"><span>📝</span>Cierre</button>
      </nav>
    </div>
  </main>

  <!-- Modal de Media y Toast (igual que antes) -->
  <div id="toast" class="toast hidden"></div>
  <script src="data/patologias.js"></script>
  <script src="app.js"></script>
</body>
</html>
